services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: always
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS (mediamtx internal, optional)
    volumes:
      - ./rtsp-server/mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]

  ffmpeg-publish:
    build: ./ffmpeg
    container_name: ffmpeg-publish
    depends_on:
      - mediamtx
    volumes:
      - ./rtsp-server/videos:/videos:ro
    restart: always
    command: >
      sh -lc "echo 'Publishing sample.mp4 -> rtsp://mediamtx:8554/sample' &&
      ffmpeg -hide_banner -loglevel info
      -re -stream_loop -1 -i /videos/sample.mp4
      -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p
      -g 50 -keyint_min 50 -sc_threshold 0
      -c:a aac -ar 48000 -b:a 128k
      -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/sample"

  ffmpeg-hls:
    build: ./ffmpeg
    container_name: ffmpeg-hls
    depends_on:
      - mediamtx
      - ffmpeg-publish
    volumes:
      - ./nginx/hls:/hls
    restart: always
    command: >
      sh -lc "echo 'Waiting for RTSP path sample...' ;
      until ffprobe -v error -rtsp_transport tcp -show_streams rtsp://mediamtx:8554/sample >/dev/null 2>&1; do
        echo 'not ready, retry in 1s...' ;
        sleep 1 ;
      done ;
      echo 'RTSP -> HLS' &&
      ffmpeg -hide_banner -loglevel info
      -rtsp_transport tcp -i rtsp://mediamtx:8554/sample
      -fflags +genpts -avoid_negative_ts make_zero
      -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p
      -g 50 -keyint_min 50 -sc_threshold 0
      -c:a aac -ar 48000 -b:a 128k
      -f hls -hls_time 2 -hls_list_size 10
      -hls_flags delete_segments+append_list+independent_segments+temp_file
      -hls_segment_filename /hls/seg_%05d.ts
      /hls/master.m3u8"

  nginx-hls:
    image: nginx:latest
    container_name: nginx-hls
    ports:
      - "8081:80"
    volumes:
      - "D:/cctv-docker/nginx/hls:/usr/share/nginx/html/hls"
      - "D:/cctv-docker/nginx/html:/usr/share/nginx/html"
      - "D:/cctv-docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro"
